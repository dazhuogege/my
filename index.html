<!DOCTYPE html>
<html lang="zh">

<head>
<script src="https://cdn.jsdelivr.net/npm/moment@2.29.1/moment.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组队分享</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #1c1c1c; /* 深色背景 */
            color: #fff;
        }

        .header {
            background-color: #000;
            color: #f0c48c; /* 香槟金色 */
            text-align: center;
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
        }

        .advertisement {
            background-color: #333;
            color: #f0c48c;
            padding: 10px;
            font-size: 16px;
            text-align: center;
            margin-top: 10px;
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: #f0c48c;
            margin-top: 30px;
            margin-bottom: 10px;
            text-align: center;
        }

        .input-container {
            width: 80%;
            max-width: 600px;
            margin: 30px auto;
            background-color: #2c2c2c; /* 深灰背景 */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.5);
        }

        .input-container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background-color: #444;
            color: #fff;
            border: 1px solid #666;
            border-radius: 5px;
            font-size: 16px;
        }

        .input-container button {
            width: 100%;
            padding: 15px;
            background-color: #f0c48c;
            color: #000;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .input-container button:hover {
            background-color: #d1a56d; /* Hover效果 */
        }

        .team-list {
            width: 80%;
            max-width: 600px;
            margin: 30px auto;
        }

        .team-item {
            background-color: #2c2c2c;
            margin: 15px 0;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.3);
        }

        .team-item button {
            background-color: #f0c48c;
            padding: 8px 15px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .team-item button:hover {
            background-color: #d1a56d;
        }

        .team-item span {
            color: #ccc;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        组队分享
    </div>

    <div class="advertisement">
        【官方组队群】加123456
    </div>

    <!-- 小标题：发布组队信息 -->
    <div class="section-title">发布组队信息</div>
    <div class="input-container">
        <input type="text" id="team-title" placeholder="请输入组队标题">
        <input type="text" id="team-code" placeholder="请输入组队口令，如：123456">
        <button onclick="publishTeam()">发布组队</button>
    </div>

    <!-- 小标题：实时组队信息列表 -->
    <div class="section-title">实时组队列表</div>
    <div id="team-list" class="team-list">
        <!-- 实时组队信息列表 -->
    </div>

    <script>
        // 发布组队信息
        function publishTeam() {
            const title = document.getElementById('team-title').value.trim();
            const code = document.getElementById('team-code').value.trim();

            if (!title || !code) {
                alert('请完整填写组队信息！');
                return;
            }

            fetch('http://localhost:3000/publish', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title, code })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('组队信息发布成功！');
                    load(); // 更新列表
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('发布失败，请重试！');
            });

            // 清空输入框
            document.getElementById('team-title').value = '';
            document.getElementById('team-code').value = '';
        }

        // 加载实时数据
      function load() {
  fetch('http://localhost:3000/list')
    .then(res => res.json())
    .then(data => {
      const list = document.getElementById('team-list');
      list.innerHTML = ''; // 清空列表

      data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'team-item';

        // 使用 moment.js 转换为中国时间（CST）
        const localTime = moment(item.timestamp).utcOffset(8).format('YYYY-MM-DD HH:mm:ss');  // 转换为中国时间（CST）

        div.innerHTML = `
          <div>
            <strong>${item.title}</strong><br>
            ${item.code}<br>
            <span>发布时间: ${localTime}</span>
          </div>
          <button onclick="copyCode('${item.title}', '${item.code}')">复制口令</button>
        `;

        div.onclick = () => {
          navigator.clipboard.writeText(item.title + ' ' + item.code);
          alert('口令已复制！');
        };

        list.appendChild(div);
      });
    });
}

        // 复制口令功能
        function copyCode(title, code) {
            const textToCopy = `${title} - ${code}`;
            navigator.clipboard.writeText(textToCopy).then(function() {
                alert('口令已复制！');
            }, function() {
                alert('复制失败，请重试。');
            });
        }

        // 每2秒刷新一次列表
        setInterval(load, 2000);

        load(); // 初始加载一次列表
    </script>

</body>
</html>
